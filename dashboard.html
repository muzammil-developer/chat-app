<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp | Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="sidebar-header">
            <h4>ChatApp</h4>
            <button id="logout-btn" class="btn btn-sm btn-danger">
                Logout
            </button>
        </div>

        <div class="user-heading">Messages</div>

        <div id="users-list"></div>

    </div>


    <!-- Chat Area -->
    <div class="chat-area">

        <div id="chat-header">
            <h5>Select a user to start chatting</h5>
        </div>

        <div id="chat-box">
            <div class="welcome-message">
                Select a user from the left to start a conversation.
            </div>
        </div>

        <form id="chat-form">

            <input type="text" id="message-input"
                placeholder="Type a message..." autocomplete="off" disabled>

            <button type="submit" id="send-btn" disabled>
                Send
            </button>

        </form>

    </div>

</div>

<script type="module" src="index.js"></script>
</body>
</html>
